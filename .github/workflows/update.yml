name: Update addresses

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时（UTC）
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch addresses
        env:
          SUB_HOST: ${{ vars.SUB_HOST || '339389037wtkr.sub.hhauv.de5.net' }}
          DEFAULT_PORT: ${{ vars.DEFAULT_PORT || '443' }}
          LIMIT: ${{ vars.LIMIT || '0' }}
          OUTPUT: addressesapi.txt
        run: python fetch_addresses.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addressesapi.txt
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: update addressesapi.txt"
            git push
          fi
