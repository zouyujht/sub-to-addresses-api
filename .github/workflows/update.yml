name: Update addresses

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时（UTC）
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SUB_HOST secret
        env:
          SUB_HOST: ${{ secrets.SUB_HOST }}
        run: |
          if [ -z "$SUB_HOST" ]; then
            echo "::error::未配置 Secret SUB_HOST。请到 Settings → Secrets and variables → Actions 添加 Secret SUB_HOST（上游订阅生成器域名）。"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch addresses
        env:
          SUB_HOST: ${{ secrets.SUB_HOST }}
          DEFAULT_PORT: ${{ secrets.DEFAULT_PORT || '443' }}
          LIMIT: ${{ secrets.LIMIT || '0' }}
          OUTPUT: addressesapi.txt
        run: python fetch_addresses.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addressesapi.txt
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: update addressesapi.txt"
            git push
          fi
